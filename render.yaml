# Render Blueprint for the LaundryAI backend (added 2026-10-24, unapplied).
# Lets a fresh service be created from this repo in one step, instead of
# hand-configuring a service whose env vars then drift (the cause of the
# live "degraded" persistence state in Oct 2026).
#
# Refreshed 2026-11-21 to match the live service (verified via /api/health):
# CORS names the canonical Vercel URL and persistence is Supabase. The live
# service was hand-configured before this file existed; this Blueprint is the
# starting point for a fresh service, and its values now match live reality.
#
# Apply with: Render dashboard -> New -> Blueprint -> connect this repo.
# Secret values are sync:false on purpose: Render prompts for them in the
# dashboard and they are never committed here.
#
# MODEL_PATH is intentionally NOT set: an explicit MODEL_PATH disables the
# combo G ensemble (the server serves a single model instead). Leave it unset
# so the tracked ensemble (manifest + verified parts) serves.
services:
  - type: web
    name: ai-laundry-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PERSISTENCE_BACKEND
        value: supabase
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: CORS_ORIGINS
        value: https://ai-laundry-assistant-thunderdoc.vercel.app
